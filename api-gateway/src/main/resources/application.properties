spring.application.name=api-gateway
server.port=8080
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hospital-auth

# Browser origins allowed to call the API (e.g. a staff front-end)
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].allowed-headers=Authorization,Content-Type
spring.cloud.gateway.globalcors.cors-configurations.[/api/**].max-age=3600

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info

logging.config=classpath:log4j2.xml
