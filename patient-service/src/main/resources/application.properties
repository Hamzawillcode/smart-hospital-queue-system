spring.application.name=patient-service
server.port=8081

# MySQL Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_patient?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=B1sm1lla#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Logging handled by log4j2.xml
logging.config=classpath:log4j2.xml
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
# JWT Configuration
jwt.secret=hospital-queue-system-secret-key-2024-very-long-string
jwt.expiration=86400000
# localhost URLs with service names
services.queue.url=http://QUEUE-SERVICE
services.monitor.url=http://MONITOR-SERVICE
services.notification.url=http://NOTIFICATION-SERVICE
# Eureka
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# ── Kafka Configuration ────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer settings
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Consumer settings (for when patient-service consumes)
spring.kafka.consumer.group-id=patient-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hospital.common.events

# Topic names
kafka.topics.patient-checked-in=patient.checked-in
kafka.topics.doctor-assigned=doctor.assigned