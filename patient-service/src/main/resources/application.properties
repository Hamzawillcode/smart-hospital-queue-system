spring.application.name=patient-service
server.port=8081
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── MySQL: patient-service's own schema and user ───────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/opd_patient
spring.datasource.username=${PATIENT_DB_USER:patient_svc}
spring.datasource.password=${PATIENT_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# Token numbers restart at 1 every day, in the hospital's local time zone
hospital.time-zone=${HOSPITAL_TIME_ZONE:Asia/Kolkata}

# ── Kafka ─────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=patient-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
kafka.topics.partitions=3
kafka.topics.replicas=1

outbox.relay.interval-ms=200
outbox.retention-days=7

# ── Security: this service issues the JWTs ─────────────────
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hospital-auth
security.jwt.ttl=8h
app.security.users.admin.password=${ADMIN_PASSWORD}
app.security.users.admin.roles=ADMIN
app.security.users.reception.password=${STAFF_PASSWORD}
app.security.users.reception.roles=STAFF
app.security.users.doctor.password=${DOCTOR_PASSWORD}
app.security.users.doctor.roles=DOCTOR

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info

logging.config=classpath:log4j2.xml
