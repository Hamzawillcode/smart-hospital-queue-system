spring.application.name=monitor-service
server.port=8084
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── MongoDB: monitor-service's own database ────────────────
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/hospital_monitor}
spring.data.mongodb.auto-index-creation=true

# "Today" on the dashboard means the hospital's local day
hospital.time-zone=${HOSPITAL_TIME_ZONE:Asia/Kolkata}

# ── Kafka ─────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=monitor-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
kafka.topics.partitions=3
kafka.topics.replicas=1

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hospital-auth

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info

logging.config=classpath:log4j2.xml
