spring.application.name=doctor-service
server.port=8083
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── MySQL: doctor-service's own schema and user ────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/opd_doctor
spring.datasource.username=${DOCTOR_DB_USER:doctor_svc}
spring.datasource.password=${DOCTOR_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ── Kafka ─────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=doctor-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
kafka.topics.partitions=3
kafka.topics.replicas=1

outbox.relay.interval-ms=200
outbox.retention-days=7

# Safety net for lost wake-ups between concurrent SKIP LOCKED matchers
assignment.reconcile-interval-ms=2000

security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hospital-auth

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info

logging.config=classpath:log4j2.xml
