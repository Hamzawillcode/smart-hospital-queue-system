spring.application.name=queue-service
server.port=8082

# MySQL — queue's OWN database
spring.datasource.url=jdbc:mysql://localhost:3306/hospital_queue?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=B1sm1lla#
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Clean up: Hibernate detects this automatically now
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Data Initialization Fix
spring.sql.init.mode=always

# Logging
logging.config=classpath:log4j2.xml
#Eureka urls
services.doctor.url=http://DOCTOR-SERVICE
services.monitor.url=http://MONITOR-SERVICE
services.notification.url=http://NOTIFICATION-SERVICE
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
# Kafka
spring.kafka.bootstrap-servers=localhost:9092

# Consumer — queue-service CONSUMES patient.checked-in
spring.kafka.consumer.group-id=queue-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.hospital.common.events

# Producer — queue-service PRODUCES queue.updated + doctor.assigned
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Topic names
kafka.topics.patient-checked-in=patient.checked-in
kafka.topics.queue-updated=queue.updated
kafka.topics.doctor-assigned=doctor.assigned