spring.application.name=queue-service
server.port=8082
# Optional local secrets file (see .env.example at the repository root)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# ── MySQL: queue-service's own schema and user ─────────────
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/opd_queue
spring.datasource.username=${QUEUE_DB_USER:queue_svc}
spring.datasource.password=${QUEUE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# ── Kafka ─────────────────────────────────────────────────
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=queue-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.concurrency=3
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
kafka.topics.partitions=3
kafka.topics.replicas=1

# ── Outbox relay ──────────────────────────────────────────
outbox.relay.interval-ms=200
outbox.retention-days=7

# ── Queue engine ──────────────────────────────────────────
queue.avg-consultation-minutes=10
queue.aging-minutes-per-level=15
queue.strategy.default-strategy=FIFO
queue.strategy.departments.EMERGENCY=PRIORITY
queue.strategy.departments.CARDIOLOGY=AGING_PRIORITY

# ── Security (JWT issued by patient-service) ──────────────
security.jwt.secret=${JWT_SECRET}
security.jwt.issuer=hospital-auth

# ── Service discovery ─────────────────────────────────────
eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info

logging.config=classpath:log4j2.xml
