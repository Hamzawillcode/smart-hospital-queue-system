spring.application.name=notification-service
server.port=8085
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

spring.thymeleaf.cache=true

# ── Kafka ─────────────────────────────────────────────────
# Each instance uses its own consumer group, so every instance receives every
# queue.updated event and can push to the browsers connected to it. Reading from
# the earliest offset of the compacted topic rebuilds the latest state on startup.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-${random.uuid}
spring.kafka.consumer.auto-offset-reset=earliest

# Origins allowed to open the WebSocket (the gateway serves the page)
notification.allowed-origins=${NOTIFICATION_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:8085}

eureka.client.serviceUrl.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info

logging.config=classpath:log4j2.xml
