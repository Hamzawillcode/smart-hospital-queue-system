<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Your queue status</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>

    <style>
        :root { --blue: #1d4ed8; --muted: #6b7280; --ink: #111827; --bg: #f3f4f6; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: var(--bg);
               min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 16px; }
        .card { background: #fff; border-radius: 16px; padding: 32px 24px; width: 100%; max-width: 440px;
                box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; }
        h1 { color: var(--blue); font-size: 20px; }
        .sub { color: var(--muted); font-size: 14px; margin-bottom: 16px; }
        .conn { display: inline-block; font-size: 12px; padding: 4px 12px; border-radius: 12px; margin-bottom: 16px; }
        .conn.ok { background: #d1fae5; color: #065f46; }
        .conn.down { background: #fee2e2; color: #991b1b; }
        .conn.wait { background: #fef3c7; color: #92400e; }
        .token { border: 2px solid var(--blue); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
        .token small { color: var(--muted); }
        .token div { color: var(--blue); font-size: 34px; font-weight: 700; }
        .position { font-size: 72px; font-weight: 700; color: var(--ink); line-height: 1; }
        .label { color: var(--muted); margin: 6px 0 16px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
        .grid div { background: var(--bg); border-radius: 8px; padding: 12px; }
        .grid small { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; }
        .grid b { font-size: 18px; }
        .message { background: #eff6ff; border-left: 4px solid var(--blue); border-radius: 8px; padding: 14px;
                   text-align: left; color: #1e3a8a; }
        .called .message { background: #d1fae5; border-color: #10b981; color: #065f46; }
        .done .message { background: var(--bg); border-color: var(--muted); color: var(--ink); }
        @media (prefers-reduced-motion: no-preference) {
            .called .position { animation: pulse 1.2s infinite; }
            @keyframes pulse { 50% { opacity: .55; } }
        }
    </style>
</head>
<body>
<main class="card" id="card">
    <h1>Smart Hospital</h1>
    <p class="sub">Live queue status</p>
    <div id="conn" class="conn wait">Connecting…</div>

    <div class="token"><small>Your token</small><div id="token">–</div></div>

    <div class="position" id="position">–</div>
    <div class="label" id="positionLabel">Your position</div>

    <div class="grid">
        <div><small>Patients ahead</small><b id="ahead">–</b></div>
        <div><small>Est. wait</small><b id="wait">–</b></div>
    </div>

    <div class="message" id="message" role="status" aria-live="polite">Waiting for updates…</div>
    <p class="sub" style="margin-top:12px">Department: <b id="department">–</b></p>
</main>

<script th:inline="javascript">
    // Access code from the URL; validated server-side and escaped by Thymeleaf.
    const accessCode = /*[[${accessCode}]]*/ 'preview';
    let lastVersion = -1;
    let retryDelay = 1000;

    function setText(id, value) { document.getElementById(id).textContent = value; }

    function connection(state, text) {
        const el = document.getElementById('conn');
        el.className = 'conn ' + state;
        el.textContent = text;
    }

    function render(view) {
        // Ignore anything older than what is already on screen (redelivered or reordered updates).
        if (view.version < lastVersion) return;
        lastVersion = view.version;

        if (view.tokenNumber) setText('token', view.tokenNumber);
        if (view.departmentId) setText('department', view.departmentId);
        setText('message', view.message || 'Waiting for updates…');

        const card = document.getElementById('card');
        card.classList.remove('called', 'done');
        if (view.status === 'WAITING') {
            setText('position', view.position);
            setText('positionLabel', 'Your position');
            setText('ahead', view.patientsAhead);
            setText('wait', view.estimatedWaitMinutes + ' min');
        } else if (view.status === 'CALLED' || view.status === 'IN_CONSULTATION') {
            card.classList.add('called');
            setText('position', view.roomNumber ? view.roomNumber : 'Next');
            setText('positionLabel', view.roomNumber ? 'Your room' : 'You have been called');
            setText('ahead', '0');
            setText('wait', 'Now');
        } else if (view.status === 'COMPLETED') {
            card.classList.add('done');
            setText('position', '✓');
            setText('positionLabel', 'Visit finished');
            setText('ahead', '–');
            setText('wait', '–');
        }
    }

    function connect() {
        connection('wait', 'Connecting…');
        const client = Stomp.over(new SockJS('/ws'));
        client.debug = null;
        client.connect({}, function () {
            retryDelay = 1000;
            connection('ok', 'Live updates on');
            client.subscribe('/topic/patient/' + accessCode, function (frame) { render(JSON.parse(frame.body)); });
            // One-off reply with the current state, so the page is correct right after (re)connecting.
            client.subscribe('/app/patient/' + accessCode, function (frame) { render(JSON.parse(frame.body)); });
        }, function () {
            connection('down', 'Reconnecting…');
            setTimeout(connect, retryDelay);
            retryDelay = Math.min(retryDelay * 2, 30000);
        });
    }

    connect();
</script>
</body>
</html>
